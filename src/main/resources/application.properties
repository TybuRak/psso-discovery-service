spring.application.name=psso-discovery-service
# listen on all network interfaces, so other computers in the lab can reach the service
server.address=0.0.0.0
# port can be changed without rebuilding: PORT=9000 java -jar ... (default 8080)
server.port=${PORT:8080}
# dates as text (2026-11-19T10:30:00Z) instead of numbers
spring.jackson.serialization.write-dates-as-timestamps=false
